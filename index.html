<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./images_and_logos/play.png" type="image/png">
    <title>Movia</title>
</head>

<body>
    <header>
        <nav>
            <div class="logo-area">
                <img class="logo" src="./images_and_logos/play.png" alt="logo">
                <span class="logo-name"> Movia</span>
            </div>

            <div class="links">
                <a href="#films">Films</a>
                <a href="#series">Series</a>
                <a href="#favorites">Favorites</a>
                <a href="#trending">Trending</a>
            </div>

            <div class="login">
                <span class="person-add"> Log In <i class="bi bi-person-add"></i></span>
            </div>

        </nav>
    </header>

    <main>

        <div class="content">
            <div class="search-container">
                <input class="search-input" placeholder="Discover your next favorite movie">
                <div class="select-container">
                    <div class="select-genre">
                        <span class="genreValue"> Find your mood...</span>
                        <i class="bi bi-chevron-down"></i>
                    </div>
                    <div class="options-list">

                    </div>
                </div>
                <button class="search-button">axtar</button>

            </div>

            <div class="film-container">
            </div>
            <div class="pagination pagination-container">
                <button class="prevBtn"><i class="bi bi-chevron-left"></i> Əvvəlki</button>
                <span class="pageNumber"></span>
                <button class="nextBtn">Növbəti <i class="bi bi-chevron-right"></i></button>
            </div>
        </div>

        <div class="movie-details">
            <div class="details-content">
                <span class="close-btn">&times; </span>
                <div class="detail-container">
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>

    <script src="./app.js"> </script>
</body>

</html>
